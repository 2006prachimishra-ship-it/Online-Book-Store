<!DOCTYPE html>
<html>

<head>
    <title>Login - Online Book Store</title>
</head>

<body bgcolor="#F5EAF2">

    <br><br>

    <table border="1" cellpadding="15" cellspacing="0" 
           width="450" align="center" bgcolor="white">

        <!-- HEADER -->
        <tr bgcolor="#6A1E55">
            <td align="center">
                <font color="white" size="5">
                    <b>LOGIN</b>
                </font>
            </td>
        </tr>

        <!-- LOGIN FORM -->
        <tr>
            <td>

                <form>

                    <table width="100%" cellpadding="8">

                        <tr>
                            <td>
                                <b>Username</b>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <input type="text"
                                       name="username"
                                       placeholder="Enter your username"
                                       size="45"
                                       required>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <b>Password</b>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <input type="password"
                                       name="password"
                                       placeholder="Enter your password"
                                       size="45"
                                       required>
                            </td>
                        </tr>

                        <tr>
                            <td align="center">
                                <input type="submit"
                                       value="Login">
                            </td>
                        </tr>

                    </table>

                </form>

            </td>
        </tr>

        <!-- REGISTER -->
        <tr>
            <td align="center">

                Don't have an account?

                <br><br>

                <a href="registration.html">
                    <b>Register Here</b>
                </a>

            </td>
        </tr>

    </table>

</body>
</html>
